# See https://github.com/lima-vm/lima/blob/master/templates/default.yaml for all lima options

# To use a locally built image instead, replace the images section below with:
# images:
#   - location: "./result/nixos.qcow2"
#     arch: aarch64
images:
  - location: https://github.com/saronic-technologies/nixos-lima/releases/download/v1.2.1/nixos-determinate-v1.2.1-aarch64.qcow2
    arch: aarch64
    digest: sha512:1dad52aacb5b09e8fc58205c3f6ae8c950086ffaa105ad7ef04fb1bf5f0f37397578aa7f4be5f5a547c7a0b86753c3f29bb89ff8c8414457709b1cdece4d9500
  - location: https://github.com/saronic-technologies/nixos-lima/releases/download/v1.2.1/nixos-determinate-v1.2.1-x86_64.qcow2
    arch: x86_64
    digest: sha512:1373223530a83b07d850afaffd06032b0745f65dca7c880cc148fd062492b1b79a00155d8b7dc329eb22f0633236feeb558954eba725cc0bd65913feef6979df

mounts:
  - location: '~'
    writable: true
  - location: '~/.ssh'
    mountPoint: '/home/lima.guest/.ssh'
    writable: false
  - location: '~/.sb'
    mountPoint: '/home/lima.guest/.sb'
    writable: false

vmOpts:
  vz:
    rosetta:
      enabled: true

cpus: 12
memory: 40GiB
disk: 1024GiB

portForwards:
  # NixOS intercepts UDP port 68 (DHCP), which causes Lima's port-forwarding to
  # capture host DHCP packets. Ignore it explicitly to prevent network issues.
  # See: https://github.com/nixos-lima/nixos-lima/issues/50
  - proto: udp
    guestPort: 68
    guestIP: 0.0.0.0
    ignore: true

containerd:
  system: false
  user: false

# user:
#   name: "developer"

# ssh:
#   localPort: 60022
